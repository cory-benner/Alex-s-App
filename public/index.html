<!DOCTYPE html>
<html class="light" lang="en" style="">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'self'"/>

    <title>Chatty Buddy</title>

    <link href="assets/css/chatty_buddy_fonts.css" rel="stylesheet"/>
    <link href="assets/css/chatty_buddy_styles.css" rel="stylesheet"/>
</head>
<body class="bg-[#fbf9f4] text-on-surface min-h-screen flex flex-col select-none touch-manipulation">
    
    <!-- TopAppBar -->
    <header id="mainHeader" class="hidden w-full top-0 px-6 pt-8 bg-[#fbf9f4] flex justify-between items-center z-50">
        <div class="flex items-center gap-4">
            <span class="material-symbols-outlined text-primary-container text-4xl">face_6</span>
            <h1 class="text-2xl font-bold text-on-surface">Chatty Buddy</h1>
        </div>
        <button data-action="openSetup" class="active:scale-95 transition-transform p-3 rounded-full hover:bg-surface-container-highest">
            <span class="material-symbols-outlined text-on-surface-variant text-3xl">settings</span>
        </button>
    </header>

    <!-- Main Content Canvas -->
    <main class="flex-1 max-w-5xl mx-auto w-full px-6 py-8 pb-40">

        <!-- ==================== VIEW: LOADING FALLBACK ==================== -->
        <div id="loadingFallback" class="flex flex-col items-center justify-center h-[60vh]">
            <span class="material-symbols-outlined text-primary-container text-8xl mb-4 animate-pulse">face_6</span>
            <h2 class="text-3xl font-bold text-on-surface">Loading Buddy...</h2>
            <p class="text-on-surface-variant mt-4 text-center max-w-md">If you are stuck on this screen, your browser's security settings are blocking the app from reading its local memory.</p>
        </div>
        
        <!-- ==================== VIEW 0: SETUP SCREEN ==================== -->
        <div id="setupView" class="hidden max-w-4xl mx-auto bg-surface-container-highest p-8 rounded-[2rem] border-b-[8px] border-outline/20">
            <h2 class="text-4xl font-bold text-on-surface mb-8 text-center">⚙️ Device Setup</h2>
            
            <div class="mb-8">
                <label class="block text-2xl font-bold text-on-surface-variant mb-2">Child's Name</label>
                <input type="text" id="childNameInput" class="w-full text-2xl p-4 rounded-xl border-2 border-outline/30 focus:border-primary-container outline-none bg-white" placeholder="Enter name...">
            </div>

            <div class="mb-8 bg-white p-6 rounded-2xl shadow-sm">
                <label class="block text-2xl font-bold text-on-surface mb-4">Add Custom Word & Photo</label>
                
                <div class="flex flex-col md:flex-row gap-4 mb-6 items-center">
                    <input type="file" id="photoUpload" accept="image/*" class="hidden">
                    <label for="photoUpload" id="photoPreviewLabel" class="w-24 h-24 bg-surface-container rounded-full border-4 border-dashed border-outline/30 flex items-center justify-center cursor-pointer hover:bg-outline/10 overflow-hidden shrink-0">
                        <span id="photoPreviewIcon" class="material-symbols-outlined text-4xl text-on-surface-variant">add_a_photo</span>
                        <img id="photoPreviewImage" class="hidden w-full h-full object-cover">
                    </label>

                    <div class="flex-1 w-full flex flex-col md:flex-row gap-2">
                        <select id="newWordCategory" class="text-xl p-4 rounded-xl border-2 border-outline/30 focus:border-primary-container outline-none bg-surface-container font-bold">
                            <option value="iNeed">🖐️ I Need...</option>
                            <option value="iFeel">😃 I Feel...</option>
                            <option value="people">👨‍👩‍👦 People</option>
                            <option value="activities">🤖 Activities</option>
                        </select>

                        <input type="text" id="newWordEmoji" class="w-20 text-center text-3xl p-4 rounded-xl border-2 border-outline/30 focus:border-primary-container outline-none bg-surface-container" placeholder="🍎" title="Fallback Emoji">
                        <input type="text" id="newWordLabel" class="flex-1 text-2xl p-4 rounded-xl border-2 border-outline/30 focus:border-primary-container outline-none bg-surface-container" placeholder="Word (e.g. Drink, Happy...)">
                        <button data-action="addWordToSetup" class="bg-primary-container text-on-primary-container px-6 py-4 rounded-xl font-bold text-xl active:scale-95 transition-transform border-b-4 border-on-primary-container/20">Add</button>
                    </div>
                </div>
                
                <div id="setupDictionaryList" class="bg-surface-container p-4 rounded-xl border-2 border-outline/10 h-[400px] overflow-y-auto flex flex-col gap-6">
                    <!-- Populated via JS -->
                </div>
            </div>

            <button data-action="saveAndStart" class="w-full bg-primary-container text-on-primary-container text-3xl font-bold py-6 rounded-2xl border-b-[8px] border-on-primary-container/30 active:scale-95 transition-transform shadow-md">
                Save & Start Talking
            </button>
        </div>

        <!-- ==================== VIEW 1: HOME GRID ==================== -->
        <div id="homeContainer" class="hidden">
            <section class="mb-12 text-center max-w-2xl mx-auto">
                <h2 id="greetingText" class="text-5xl font-bold text-on-surface mb-4">Hi Buddy!</h2>
                <p class="text-2xl text-on-surface-variant">Tell me what you need.</p>
            </section>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                <button data-action="openCategory" data-category="iNeed" class="group flex flex-col items-center justify-center min-h-[280px] p-8 rounded-[2.5rem] bg-primary-container border-b-[10px] border-on-primary-container/20 active:scale-95 transition-transform shadow-sm">
                    <div class="w-32 h-32 mb-4 bg-white/40 rounded-full flex items-center justify-center">
                        <span class="material-symbols-outlined text-on-primary-container text-7xl">front_hand</span>
                    </div>
                    <span class="text-4xl font-bold text-on-primary-container mb-2">I Need</span>
                    <span id="preview-iNeed" class="text-xl text-on-primary-container/80 line-clamp-1"></span>
                </button>
                
                <button data-action="openCategory" data-category="iFeel" class="group flex flex-col items-center justify-center min-h-[280px] p-8 rounded-[2.5rem] bg-secondary-container border-b-[10px] border-secondary-container/50 active:scale-95 transition-transform shadow-sm">
                    <div class="w-32 h-32 mb-4 bg-white/30 rounded-full flex items-center justify-center">
                        <span class="material-symbols-outlined text-white text-7xl">mood</span>
                    </div>
                    <span class="text-4xl font-bold text-white mb-2">I Feel</span>
                    <span id="preview-iFeel" class="text-xl text-white/80 line-clamp-1"></span>
                </button>
                
                <button data-action="openCategory" data-category="people" class="group flex flex-col items-center justify-center min-h-[280px] p-8 rounded-[2.5rem] bg-tertiary-container border-b-[10px] border-on-tertiary-container/20 active:scale-95 transition-transform shadow-sm">
                    <div class="w-32 h-32 mb-4 bg-white/40 rounded-full flex items-center justify-center">
                        <span class="material-symbols-outlined text-on-tertiary-container text-7xl">family_history</span>
                    </div>
                    <span class="text-4xl font-bold text-on-tertiary-container mb-2">People</span>
                    <span id="preview-people" class="text-xl text-on-tertiary-container/80 line-clamp-1"></span>
                </button>
                
                <button data-action="openCategory" data-category="activities" class="group flex flex-col items-center justify-center min-h-[280px] p-8 rounded-[2.5rem] bg-surface-container-highest border-b-[10px] border-outline/20 active:scale-95 transition-transform shadow-sm">
                    <div class="w-32 h-32 mb-4 bg-white/50 rounded-full flex items-center justify-center">
                        <span class="material-symbols-outlined text-on-surface text-7xl">smart_toy</span>
                    </div>
                    <span class="text-4xl font-bold text-on-surface mb-2">Activities</span>
                    <span id="preview-activities" class="text-xl text-on-surface-variant line-clamp-1"></span>
                </button>
            </div>
        </div>

        <!-- ==================== VIEW 2: DYNAMIC DRILL-DOWN ==================== -->
        <div id="categoryView" class="hidden">
            <div class="flex justify-between items-center mb-10">
                <button data-action="goHome" class="flex items-center gap-2 bg-surface-container-highest px-8 py-5 rounded-full border-b-[6px] border-outline/20 active:scale-95 transition-transform shadow-sm">
                    <span class="material-symbols-outlined text-4xl">arrow_back</span>
                    <span class="text-2xl font-bold">Back</span>
                </button>
                <div id="dynamicCategoryHeader" class="flex items-center gap-3 px-8 py-5 rounded-full border-b-[4px]">
                    <span id="dynamicCategoryIcon" class="material-symbols-outlined text-4xl"></span>
                    <span id="dynamicCategoryTitle" class="text-2xl font-bold"></span>
                </div>
            </div>
            
            <div id="dynamicCategoryGrid" class="grid grid-cols-2 md:grid-cols-3 gap-6">
                <!-- Dynamically populated via JS -->
            </div>
        </div>

        <!-- ==================== VIEW 3: QUICK TYPE KEYBOARD ==================== -->
        <div id="quickTypeView" class="hidden">
            <div class="flex justify-between items-center mb-8">
                <button data-action="goHome" class="flex items-center gap-2 bg-surface-container-highest px-8 py-5 rounded-full border-b-[6px] border-outline/20 active:scale-95 transition-transform shadow-sm">
                    <span class="material-symbols-outlined text-4xl">arrow_back</span>
                    <span class="text-2xl font-bold">Back</span>
                </button>
                <div class="flex items-center gap-3 bg-secondary-container px-8 py-5 rounded-full border-b-[4px] border-secondary-container/50">
                    <span class="material-symbols-outlined text-4xl text-white">keyboard</span>
                    <span class="text-2xl font-bold text-white">Type to Speak</span>
                </div>
            </div>
            
            <div class="bg-white p-8 rounded-[2.5rem] border-b-[8px] border-outline/10 shadow-sm flex flex-col gap-6">
                <textarea id="quickTypeInput" rows="4" class="w-full text-4xl p-6 rounded-3xl border-4 border-outline/20 focus:border-secondary-container outline-none resize-none bg-surface-container-lowest" placeholder="Type a message here..."></textarea>
                
                <div class="flex gap-4">
                    <button data-action="clearQuickType" class="flex-1 bg-surface-container-highest text-on-surface-variant text-3xl font-bold py-6 rounded-2xl border-b-[6px] border-outline/20 active:scale-95 transition-transform">
                        Clear
                    </button>
                    <button data-action="speakQuickType" class="flex-[2] bg-secondary-container text-white text-3xl font-bold py-6 rounded-2xl border-b-[6px] border-secondary-container/50 active:scale-95 transition-transform shadow-md flex justify-center items-center gap-3">
                        <span class="material-symbols-outlined text-4xl">volume_up</span> Speak
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- BottomNavBar -->
    <nav id="bottomNav" class="hidden fixed bottom-0 left-0 w-full z-50 flex justify-center gap-16 items-center px-6 pb-8 pt-4 bg-[#fbf9f4] rounded-t-3xl border-t-2 border-outline/10 shadow-[0_-10px_40px_rgba(0,0,0,0.05)]">
        <button data-action="speak" data-speak="Emergency Help!" class="bg-error text-on-error w-24 h-24 rounded-full flex flex-col items-center justify-center border-b-[8px] border-error/50 active:scale-90 transition-transform shadow-lg relative -top-6">
            <span class="material-symbols-outlined text-5xl">emergency</span>
            <span class="text-sm font-bold mt-1">HELP</span>
        </button>
        <button data-action="openQuickType" class="flex flex-col items-center justify-center text-on-surface-variant w-20 h-20 active:scale-90 transition-transform bg-surface-container-highest rounded-full border-b-[4px] border-outline/20">
            <span class="material-symbols-outlined text-4xl">keyboard</span>
        </button>
    </nav>

    <script src="assets/js/chatty_buddy_app.js" defer></script>
</body>
</html>
