<!DOCTYPE html>
<html class="light" lang="en" style="">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        try{
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        "colors": {
                            "tertiary-container": "#8ff199",
                            "secondary-container": "#4c96fe",
                            "surface-container-lowest": "#ffffff",
                            "on-tertiary-container": "#00702a",
                            "surface-container-low": "#f5f3ee",
                            "error": "#ba1a1a",
                            "on-background": "#1b1c19",
                            "surface-container": "#f0eee9",
                            "primary-container": "#ffd93d",
                            "on-surface": "#1b1c19",
                            "outline": "#7e7761",
                            "surface": "#fbf9f4",
                            "on-error": "#ffffff",
                            "on-surface-variant": "#4d4633",
                            "on-primary-container": "#725e00",
                            "surface-container-highest": "#e4e2dd",
                            "outline-variant": "#d0c6ad"
                        },
                        "spacing": {
                            "touch-target-min": "64px",
                            "margin-mobile": "24px",
                            "margin-desktop": "64px",
                        },
                        "fontFamily": {
                            "body-lg": ["Quicksand"],
                            "label-bold": ["Quicksand"],
                            "display-lg-mobile": ["Quicksand"],
                            "display-lg": ["Quicksand"]
                        }
                    }
                }
            }
        }catch(_e){}
    </script>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
    
    <!-- TopAppBar -->
    <header class="w-full top-0 px-margin-mobile pt-8 bg-surface flex justify-between items-center h-touch-target-min z-50">
        <div class="active:scale-95 transition-transform flex items-center gap-4">
            <span class="material-symbols-outlined text-primary-container text-4xl" data-icon="face_6">face_6</span>
            <h1 class="text-display-lg-mobile font-display-lg-mobile text-on-surface">Chatty Buddy</h1>
        </div>
        <div class="flex items-center gap-4">
            <button class="active:scale-95 transition-transform p-3 rounded-full hover:bg-surface-variant">
                <span class="material-symbols-outlined text-on-surface-variant text-3xl" data-icon="settings">settings</span>
            </button>
        </div>
    </header>

    <!-- Main Content Canvas -->
    <main class="flex-1 max-w-4xl mx-auto w-full px-margin-mobile py-12 pb-40">
        
        <!-- Welcome Section -->
        <section class="mb-16 text-center max-w-2xl mx-auto" id="greetingHeader">
            <h2 class="text-display-lg font-display-lg text-on-surface mb-4">Hi Buddy!</h2>
            <p class="text-body-lg font-body-lg text-on-surface-variant">Tell me what you need.</p>
        </section>

        <!-- VIEW 1: HOME GRID -->
        <div id="homeView" class="grid grid-cols-1 md:grid-cols-2 gap-20">
            <!-- I Need Button (Triggers view swap) -->
            <button onclick="openNeedView()" class="slab-button group relative flex flex-col items-center justify-center min-h-[320px] p-12 rounded-xl bg-primary-container border-b-[8px] border-on-primary-container/30 active:scale-95 transition-transform">
                <div class="w-40 h-40 mb-6 bg-white/40 rounded-full flex items-center justify-center">
                    <span class="material-symbols-outlined text-on-primary-container text-8xl">front_hand</span>
                </div>
                <span class="text-4xl font-bold text-on-primary-container mb-2">I Need</span>
                <span class="text-xl text-on-primary-container/70">Food • Water • Help</span>
            </button>
            
            <!-- I Feel Button -->
            <button class="slab-button group relative flex flex-col items-center justify-center min-h-[320px] p-12 rounded-xl bg-secondary-container border-b-[8px] border-on-secondary-container/30 active:scale-95 transition-transform">
                <div class="w-40 h-40 mb-6 bg-white/40 rounded-full flex items-center justify-center">
                    <span class="material-symbols-outlined text-white text-8xl">mood</span>
                </div>
                <span class="text-4xl font-bold text-white mb-2">I Feel</span>
                <span class="text-xl text-white/70">Happy • Sad • Hurt</span>
            </button>
            
            <!-- People Button -->
            <button class="slab-button group relative flex flex-col items-center justify-center min-h-[320px] p-12 rounded-xl bg-tertiary-container border-b-[8px] border-on-tertiary-container/30 active:scale-95 transition-transform">
                <div class="w-40 h-40 mb-6 bg-white/40 rounded-full flex items-center justify-center">
                    <span class="material-symbols-outlined text-on-tertiary-container text-8xl">family_history</span>
                </div>
                <span class="text-4xl font-bold text-on-tertiary-container mb-2">People</span>
                <span class="text-xl text-on-tertiary-container/70">Mom • Dad</span>
            </button>
            
            <!-- Activities Button -->
            <button class="slab-button group relative flex flex-col items-center justify-center min-h-[320px] p-12 rounded-xl bg-surface-container-highest border-b-[8px] border-outline/30 active:scale-95 transition-transform">
                <div class="w-40 h-40 mb-6 bg-white/40 rounded-full flex items-center justify-center">
                    <span class="material-symbols-outlined text-on-surface text-8xl">smart_toy</span>
                </div>
                <span class="text-4xl font-bold text-on-surface mb-2">Activities</span>
                <span class="text-xl text-on-surface-variant">Play • Sleep • Potty</span>
            </button>
        </div>

        <!-- VIEW 2: 'I NEED' DRILL-DOWN (Initially Hidden) -->
        <div id="iNeedView" class="hidden">
            
            <!-- Dedicated Top Bar for Sub-Menus -->
            <div class="flex justify-between items-center mb-10">
                <button onclick="goHome()" class="flex items-center gap-2 bg-surface-container-highest px-6 py-4 rounded-full border-b-[4px] border-outline/30 active:scale-95 transition-transform">
                    <span class="material-symbols-outlined text-4xl">arrow_back</span>
                    <span class="text-2xl font-bold">Go Back</span>
                </button>
                <div class="flex items-center gap-4 bg-primary-container px-8 py-4 rounded-full">
                    <span class="material-symbols-outlined text-4xl text-on-primary-container">front_hand</span>
                    <span class="text-2xl font-bold text-on-primary-container">I Need...</span>
                </div>
            </div>

            <!-- Sub-Grid Options -->
            <div class="grid grid-cols-2 md:grid-cols-3 gap-8">
                <!-- Food Card -->
                <button onclick="speak('I need food')" class="slab-button bg-white flex flex-col items-center justify-center min-h-[240px] p-8 rounded-xl border-b-[6px] border-outline-variant active:scale-95 transition-transform">
                    <span class="text-8xl mb-4">🍎</span>
                    <span class="text-3xl font-bold text-on-surface">Food</span>
                </button>
                
                <!-- Water Card -->
                <button onclick="speak('I need water')" class="slab-button bg-white flex flex-col items-center justify-center min-h-[240px] p-8 rounded-xl border-b-[6px] border-outline-variant active:scale-95 transition-transform">
                    <span class="text-8xl mb-4">💧</span>
                    <span class="text-3xl font-bold text-on-surface">Water</span>
                </button>

                <!-- Help Card -->
                <button onclick="speak('I need help')" class="slab-button bg-white flex flex-col items-center justify-center min-h-[240px] p-8 rounded-xl border-b-[6px] border-outline-variant active:scale-95 transition-transform">
                    <span class="text-8xl mb-4">🆘</span>
                    <span class="text-3xl font-bold text-on-surface">Help</span>
                </button>
            </div>
        </div>

    </main>

    <!-- BottomNavBar -->
    <nav class="fixed bottom-0 left-0 w-full z-50 flex justify-center gap-20 items-center px-margin-desktop pb-10 pt-6 bg-surface-container rounded-t-xl border-t-4 border-outline-variant shadow-lg">
        <button onclick="speak('Emergency Help!')" class="slab-button bg-error text-on-error w-24 h-24 rounded-full flex flex-col items-center justify-center border-b-[8px] border-error/50 active:scale-90 transition-transform">
            <span class="material-symbols-outlined text-5xl">emergency</span>
            <span class="text-label-bold font-label-bold text-[12px]">HELP</span>
        </button>
        
        <button class="flex flex-col items-center justify-center text-on-surface-variant w-24 h-24 active:scale-90 transition-transform">
            <span class="material-symbols-outlined text-5xl">chat</span>
        </button>
    </nav>

    <script>
        // View Switching Logic
        const homeView = document.getElementById('homeView');
        const iNeedView = document.getElementById('iNeedView');
        const greetingHeader = document.getElementById('greetingHeader');

        function openNeedView() {
            homeView.classList.add('hidden');
            greetingHeader.classList.add('hidden');
            iNeedView.classList.remove('hidden');
            speak("I need"); // Auditory feedback for the category selection
        }

        function goHome() {
            iNeedView.classList.add('hidden');
            homeView.classList.remove('hidden');
            greetingHeader.classList.remove('hidden');
        }

        // Native Speech Synthesis
        function speak(text) {
            window.speechSynthesis.cancel(); // Clears any overlapping audio
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        // Haptic Feedback
        document.querySelectorAll('.slab-button').forEach(button => {
            button.addEventListener('mousedown', () => {
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(20);
                }
            });
        });
    </script>
</body>
</html>
