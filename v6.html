<!DOCTYPE html>
<html class="light" lang="en" style="">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Chatty Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        try{
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        "colors": {
                            "tertiary-container": "#8ff199",
                            "secondary-container": "#4c96fe",
                            "on-tertiary-container": "#00702a",
                            "surface-container-highest": "#e4e2dd",
                            "primary-container": "#ffd93d",
                            "on-primary-container": "#725e00",
                            "on-surface": "#1b1c19",
                            "on-surface-variant": "#4d4633",
                            "surface-container": "#f0eee9",
                            "outline": "#7e7761",
                            "error": "#ba1a1a",
                            "on-error": "#ffffff",
                        },
                        "fontFamily": {
                            "body-lg": ["Quicksand"],
                            "display-lg": ["Quicksand"]
                        }
                    }
                }
            }
        }catch(_e){}
    </script>
</head>
<body class="bg-[#fbf9f4] text-on-surface min-h-screen flex flex-col select-none touch-manipulation">
    
    <header id="mainHeader" class="hidden w-full top-0 px-6 pt-8 bg-[#fbf9f4] flex justify-between items-center z-50">
        <div class="flex items-center gap-4">
            <span class="material-symbols-outlined text-primary-container text-4xl">face_6</span>
            <h1 class="text-2xl font-bold text-on-surface">Chatty Buddy</h1>
        </div>
        <button onclick="openSetup()" class="active:scale-95 transition-transform p-3 rounded-full hover:bg-surface-container-highest">
            <span class="material-symbols-outlined text-on-surface-variant text-3xl">settings</span>
        </button>
    </header>

    <main class="flex-1 max-w-5xl mx-auto w-full px-6 py-8 pb-40">
        
        <div id="setupView" class="hidden max-w-3xl mx-auto bg-surface-container-highest p-8 rounded-[2rem] border-b-[8px] border-outline/20">
            <h2 class="text-4xl font-bold text-on-surface mb-8 text-center">⚙️ Device Setup</h2>
            
            <div class="mb-8">
                <label class="block text-2xl font-bold text-on-surface-variant mb-2">Child's Name</label>
                <input type="text" id="childNameInput" class="w-full text-2xl p-4 rounded-xl border-2 border-outline/30 focus:border-primary-container outline-none bg-white" placeholder="Enter name...">
            </div>

            <div class="mb-8 bg-white p-6 rounded-2xl shadow-sm">
                <label class="block text-2xl font-bold text-on-surface mb-4">Add People (Family & Friends)</label>
                
                <div class="flex flex-col md:flex-row gap-4 mb-6 items-center">
                    <input type="file" id="photoUpload" accept="image/*" class="hidden" onchange="handlePhotoSelect(event)">
                    
                    <label for="photoUpload" id="photoPreviewLabel" class="w-24 h-24 bg-surface-container rounded-full border-4 border-dashed border-outline/30 flex items-center justify-center cursor-pointer hover:bg-outline/10 overflow-hidden shrink-0">
                        <span id="photoPreviewIcon" class="material-symbols-outlined text-4xl text-on-surface-variant">add_a_photo</span>
                        <img id="photoPreviewImage" class="hidden w-full h-full object-cover">
                    </label>

                    <div class="flex-1 w-full flex gap-2">
                        <input type="text" id="newPersonEmoji" class="w-20 text-center text-3xl p-4 rounded-xl border-2 border-outline/30 focus:border-tertiary-container outline-none bg-surface-container" placeholder="👩" title="Fallback Emoji">
                        <input type="text" id="newPersonName" class="flex-1 text-2xl p-4 rounded-xl border-2 border-outline/30 focus:border-tertiary-container outline-none bg-surface-container" placeholder="e.g., Mom, Sister...">
                        <button onclick="addPersonToSetup()" class="bg-tertiary-container text-on-tertiary-container px-6 py-4 rounded-xl font-bold text-xl active:scale-95 transition-transform border-b-4 border-on-tertiary-container/20">Add</button>
                    </div>
                </div>
                
                <div id="setupPeopleList" class="bg-surface-container p-4 rounded-xl border-2 border-outline/10 min-h-[100px] flex flex-col gap-3">
                    </div>
            </div>

            <button onclick="saveAndStart()" class="w-full bg-primary-container text-on-primary-container text-3xl font-bold py-6 rounded-2xl border-b-[8px] border-on-primary-container/30 active:scale-95 transition-transform shadow-md">
                Save & Start Talking
            </button>
        </div>

        <div id="homeContainer" class="hidden">
            <section class="mb-12 text-center max-w-2xl mx-auto">
                <h2 id="greetingText" class="text-5xl font-bold text-on-surface mb-4">Hi Buddy!</h2>
                <p class="text-2xl text-on-surface-variant">Tell me what you need.</p>
            </section>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                <button onclick="switchView('iNeedView', 'I need')" class="group flex flex-col items-center justify-center min-h-[280px] p-8 rounded-[2.5rem] bg-primary-container border-b-[10px] border-on-primary-container/20 active:scale-95 transition-transform shadow-sm">
                    <div class="w-32 h-32 mb-4 bg-white/40 rounded-full flex items-center justify-center">
                        <span class="material-symbols-outlined text-on-primary-container text-7xl">front_hand</span>
                    </div>
                    <span class="text-4xl font-bold text-on-primary-container mb-2">I Need</span>
                    <span class="text-xl text-on-primary-container/80">Food • Water • Help</span>
                </button>
                
                <button class="group flex flex-col items-center justify-center min-h-[280px] p-8 rounded-[2.5rem] bg-secondary-container border-b-[10px] border-secondary-container/50 active:scale-95 transition-transform shadow-sm">
                    <div class="w-32 h-32 mb-4 bg-white/30 rounded-full flex items-center justify-center">
                        <span class="material-symbols-outlined text-white text-7xl">mood</span>
                    </div>
                    <span class="text-4xl font-bold text-white mb-2">I Feel</span>
                    <span class="text-xl text-white/80">Happy • Sad • Hurt</span>
                </button>
                
                <button onclick="switchView('peopleView', 'People')" class="group flex flex-col items-center justify-center min-h-[280px] p-8 rounded-[2.5rem] bg-tertiary-container border-b-[10px] border-on-tertiary-container/20 active:scale-95 transition-transform shadow-sm">
                    <div class="w-32 h-32 mb-4 bg-white/40 rounded-full flex items-center justify-center">
                        <span class="material-symbols-outlined text-on-tertiary-container text-7xl">family_history</span>
                    </div>
                    <span class="text-4xl font-bold text-on-tertiary-container mb-2">People</span>
                    <span class="text-xl text-on-tertiary-container/80">Mom • Dad • Friends</span>
                </button>
                
                <button class="group flex flex-col items-center justify-center min-h-[280px] p-8 rounded-[2.5rem] bg-surface-container-highest border-b-[10px] border-outline/20 active:scale-95 transition-transform shadow-sm">
                    <div class="w-32 h-32 mb-4 bg-white/50 rounded-full flex items-center justify-center">
                        <span class="material-symbols-outlined text-on-surface text-7xl">smart_toy</span>
                    </div>
                    <span class="text-4xl font-bold text-on-surface mb-2">Activities</span>
                    <span class="text-xl text-on-surface-variant">Play • Sleep • Potty</span>
                </button>
            </div>
        </div>

        <div id="iNeedView" class="hidden">
            <div class="flex justify-between items-center mb-10">
                <button onclick="goHome()" class="flex items-center gap-2 bg-surface-container-highest px-8 py-5 rounded-full border-b-[6px] border-outline/20 active:scale-95 transition-transform shadow-sm">
                    <span class="material-symbols-outlined text-4xl">arrow_back</span>
                    <span class="text-2xl font-bold">Back</span>
                </button>
                <div class="flex items-center gap-3 bg-primary-container px-8 py-5 rounded-full border-b-[4px] border-on-primary-container/10">
                    <span class="material-symbols-outlined text-4xl text-on-primary-container">front_hand</span>
                    <span class="text-2xl font-bold text-on-primary-container">I Need...</span>
                </div>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-6">
                <button onclick="speak('I need food')" class="bg-white flex flex-col items-center justify-center min-h-[240px] p-6 rounded-[2rem] border-b-[8px] border-outline/20 active:scale-95 transition-transform shadow-sm">
                    <span class="text-8xl mb-4">🍎</span>
                    <span class="text-3xl font-bold text-on-surface">Food</span>
                </button>
                <button onclick="speak('I need water')" class="bg-white flex flex-col items-center justify-center min-h-[240px] p-6 rounded-[2rem] border-b-[8px] border-outline/20 active:scale-95 transition-transform shadow-sm">
                    <span class="text-8xl mb-4">💧</span>
                    <span class="text-3xl font-bold text-on-surface">Water</span>
                </button>
                <button onclick="speak('I need help')" class="bg-white flex flex-col items-center justify-center min-h-[240px] p-6 rounded-[2rem] border-b-[8px] border-outline/20 active:scale-95 transition-transform shadow-sm">
                    <span class="text-8xl mb-4">🆘</span>
                    <span class="text-3xl font-bold text-on-surface">Help</span>
                </button>
            </div>
        </div>

        <div id="peopleView" class="hidden">
            <div class="flex justify-between items-center mb-10">
                <button onclick="goHome()" class="flex items-center gap-2 bg-surface-container-highest px-8 py-5 rounded-full border-b-[6px] border-outline/20 active:scale-95 transition-transform shadow-sm">
                    <span class="material-symbols-outlined text-4xl">arrow_back</span>
                    <span class="text-2xl font-bold">Back</span>
                </button>
                <div class="flex items-center gap-3 bg-tertiary-container px-8 py-5 rounded-full border-b-[4px] border-on-tertiary-container/10">
                    <span class="material-symbols-outlined text-4xl text-on-tertiary-container">family_history</span>
                    <span class="text-2xl font-bold text-on-tertiary-container">People</span>
                </div>
            </div>
            
            <div id="peopleDynamicGrid" class="grid grid-cols-2 md:grid-cols-3 gap-6">
                </div>
        </div>

    </main>

    <nav id="bottomNav" class="hidden fixed bottom-0 left-0 w-full z-50 flex justify-center gap-16 items-center px-6 pb-8 pt-4 bg-[#fbf9f4] rounded-t-3xl border-t-2 border-outline/10 shadow-[0_-10px_40px_rgba(0,0,0,0.05)]">
        <button onclick="speak('Emergency Help!')" class="bg-error text-on-error w-24 h-24 rounded-full flex flex-col items-center justify-center border-b-[8px] border-error/50 active:scale-90 transition-transform shadow-lg relative -top-6">
            <span class="material-symbols-outlined text-5xl">emergency</span>
            <span class="text-sm font-bold mt-1">HELP</span>
        </button>
        <button class="flex flex-col items-center justify-center text-on-surface-variant w-20 h-20 active:scale-90 transition-transform bg-surface-container-highest rounded-full border-b-[4px] border-outline/20">
            <span class="material-symbols-outlined text-4xl">chat</span>
        </button>
    </nav>

    <script>
        // Data Structure
        let appData = {
            childName: "",
            people: [] // { id: 1, name: "Mom", emoji: "👩", photoData: "base64..." }
        };
        let currentTempPhoto = null; // Holds photo before saving

        // DOM Elements
        const setupView = document.getElementById('setupView');
        const homeContainer = document.getElementById('homeContainer');
        const mainHeader = document.getElementById('mainHeader');
        const bottomNav = document.getElementById('bottomNav');
        const greetingText = document.getElementById('greetingText');
        const views = ['homeContainer', 'iNeedView', 'peopleView', 'setupView'];

        // --- Initialization ---
        function initApp() {
            const savedData = localStorage.getItem('chattyBuddyData_v2');
            if (savedData) {
                appData = JSON.parse(savedData);
                greetingText.innerText = `Hi ${appData.childName}!`;
                renderPeopleGrid();
                goHome();
            } else {
                openSetup();
            }
        }

        // --- View Routing ---
        function switchView(targetViewId, speechPhrase = null) {
            views.forEach(viewId => document.getElementById(viewId).classList.add('hidden'));
            document.getElementById(targetViewId).classList.remove('hidden');
            if (speechPhrase) speak(speechPhrase);
        }

        function goHome() {
            switchView('homeContainer');
            mainHeader.classList.remove('hidden');
            bottomNav.classList.remove('hidden');
        }

        function openSetup() {
            switchView('setupView');
            mainHeader.classList.add('hidden');
            bottomNav.classList.add('hidden');
            document.getElementById('childNameInput').value = appData.childName;
            resetPhotoUpload();
            renderSetupPeopleList();
        }

        // --- Photo Processing (The Auto-Compressor) ---
        function handlePhotoSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    // Compress image via Canvas to save LocalStorage space
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 300; // Resize to 300x300 max
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                    } else {
                        if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Save as low-quality JPEG to prevent quota errors
                    currentTempPhoto = canvas.toDataURL('image/jpeg', 0.6); 
                    
                    // Update UI
                    document.getElementById('photoPreviewIcon').classList.add('hidden');
                    const previewImg = document.getElementById('photoPreviewImage');
                    previewImg.src = currentTempPhoto;
                    previewImg.classList.remove('hidden');
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function resetPhotoUpload() {
            currentTempPhoto = null;
            document.getElementById('photoUpload').value = '';
            document.getElementById('photoPreviewIcon').classList.remove('hidden');
            document.getElementById('photoPreviewImage').classList.add('hidden');
            document.getElementById('photoPreviewImage').src = '';
        }

        // --- Setup Logic ---
        function addPersonToSetup() {
            const nameInput = document.getElementById('newPersonName');
            const emojiInput = document.getElementById('newPersonEmoji');
            
            if (nameInput.value.trim() === '') return;

            appData.people.push({
                id: Date.now(),
                name: nameInput.value.trim(),
                emoji: emojiInput.value.trim() || '🧑',
                photoData: currentTempPhoto // Will be null if no photo selected
            });

            nameInput.value = '';
            emojiInput.value = '';
            resetPhotoUpload();
            renderSetupPeopleList();
        }

        function removePersonFromSetup(id) {
            appData.people = appData.people.filter(p => p.id !== id);
            renderSetupPeopleList();
        }

        function renderSetupPeopleList() {
            const list = document.getElementById('setupPeopleList');
            list.innerHTML = '';
            if (appData.people.length === 0) return;

            appData.people.forEach(person => {
                const item = document.createElement('div');
                item.className = 'flex justify-between items-center bg-white p-3 rounded-xl border border-outline/10 shadow-sm';
                
                // Show photo if available, otherwise fallback emoji
                const visual = person.photoData 
                    ? `<img src="${person.photoData}" class="w-16 h-16 rounded-full object-cover border-2 border-surface-container">` 
                    : `<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center text-3xl">${person.emoji}</div>`;

                item.innerHTML = `
                    <div class="flex items-center gap-4">
                        ${visual}
                        <span class="text-2xl font-bold">${person.name}</span>
                    </div>
                    <button onclick="removePersonFromSetup(${person.id})" class="text-error bg-error/10 w-12 h-12 rounded-full flex items-center justify-center hover:bg-error/20">
                        <span class="material-symbols-outlined">delete</span>
                    </button>
                `;
                list.appendChild(item);
            });
        }

        function saveAndStart() {
            appData.childName = document.getElementById('childNameInput').value.trim() || "Buddy";
            localStorage.setItem('chattyBuddyData_v2', JSON.stringify(appData));
            greetingText.innerText = `Hi ${appData.childName}!`;
            renderPeopleGrid();
            goHome();
        }

        // --- Dynamic Content Rendering ---
        function renderPeopleGrid() {
            const grid = document.getElementById('peopleDynamicGrid');
            grid.innerHTML = '';

            appData.people.forEach(person => {
                const btn = document.createElement('button');
                btn.className = 'bg-white flex flex-col items-center justify-center min-h-[240px] p-6 rounded-[2.5rem] border-b-[8px] border-outline/10 active:scale-95 transition-transform shadow-sm';
                btn.onclick = () => speak(`I want ${person.name}`);
                
                const visual = person.photoData 
                    ? `<img src="${person.photoData}" class="w-32 h-32 mb-4 rounded-full object-cover border-4 border-surface-container shadow-sm">` 
                    : `<span class="text-[6rem] mb-4">${person.emoji}</span>`;

                btn.innerHTML = `
                    ${visual}
                    <span class="text-3xl font-bold text-on-surface">${person.name}</span>
                `;
                grid.appendChild(btn);
            });
        }

        // --- Native Speech Synthesis ---
        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        window.onload = initApp;
    </script>
</body>
</html>
